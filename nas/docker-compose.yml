# Family-Planner – Hilfsprogramm für den NAS (Container Manager → Projekt)
# Braucht ca. 5–10 MB Arbeitsspeicher.
services:
  family-planner-nas:
    image: nginx:alpine
    container_name: family-planner-nas
    restart: unless-stopped
    ports:
      - "8890:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "nas:host-gateway"
    mem_limit: 64m
