# Family-Planner – Hilfsprogramm auf dem Synology NAS
# Leitet nur die Datei-Schnittstelle des NAS (File Station) weiter und ergänzt die Freigabe,
# damit die App (https://leibi-tech.github.io) darauf zugreifen darf.
# Die Anmeldung macht weiterhin der NAS selbst (Benutzer, Passwort, 2-Schritt-Code).
# Die NAS-Oberfläche (DSM) ist über diesen Weg NICHT erreichbar.

server {
    listen 80;
    server_tokens off;
    client_max_body_size 50m;

    location = /webapi/entry.cgi {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://leibi-tech.github.io" always;
            add_header Access-Control-Allow-Methods "GET, POST" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        proxy_pass https://nas:5001;
        proxy_ssl_verify off;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "https://leibi-tech.github.io" always;
        add_header Vary Origin always;
        add_header Referrer-Policy no-referrer always;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}
